<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-label="weTech">
  <defs>
    <linearGradient id="logo-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5fd0" />
      <stop offset="1" stop-color="#1b86e8" />
    </linearGradient>
    <linearGradient id="logo-bright" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22b5f5" />
      <stop offset="1" stop-color="#1f7fe0" />
    </linearGradient>
  </defs>

  <g transform="translate(-4 0)">
    <path d="M18 28 L38 82 Q42 92 48 82 L68 30"
        fill="none" stroke="url(#logo-deep)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" />
    <path d="M52 30 L72 82 Q76 92 82 82 L96 46 Q99 34 108 34"
        fill="none" stroke="url(#logo-bright)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- "we" light, "Tech" bold: the wordmark's own weight contrast. -->
  <text x="118" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="300" fill="currentColor">we</text>
  <text x="182" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" fill="currentColor">Tech</text>
</svg>
